<script src="assets/gsap.min.js"></script><script>
(function(){

 [c.text.slice(0,2),c.text.slice(2)].forEach(function(word){const span=document.createElement('span');span.className='word';span.textContent=word;text.appendChild(span)});card.appendChild(text);

 if(i>0)tl.to('#card-'+(i-1),{scale:.97,opacity:.82,duration:.24,ease:'power2.out'},start+.1);
});
