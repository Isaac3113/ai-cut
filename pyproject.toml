[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cut"
version = "0.2.5"
description = "AI Cut: local, revisioned knowledge-video editing runtime and portable agent Skill"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = ["Pillow==11.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
asr = ["funasr==1.3.0", "modelscope>=1.25,<2", "soundfile>=0.13,<1", "huggingface-hub>=0.34,<1"]

[project.scripts]
ai-cut = "talking_head_editor.cli:main"
talking-head = "talking_head_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
